<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE-edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script
      type="module"
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"
    ></script>
    <link rel="stylesheet" href="styles/style.css" />
    <title>Traducteur de langue</title>
  </head>
  <body>
    <div class="mode">
      <label class="toggle" for="dark-mode-btn">
        <div class="toggle-track">
          <input type="checkbox" class="toggle-checkbox" id="dark-mode-btn" />
          <span class="toggle-thumb"></span>
          <img src="images/sun.png" alt="soleil" />
          <img src="images/moon.png" alt="lune" />
        </div>
      </label>
    </div>
    <div class="container">
      <div class="card input-wrapper">
        <div class="from">
          <span class="heading">De :</span>
          <div class="dropdown-container" id="input-language">
            <div class="dropdown-toggle">
              <ion-icon name="globe-outline"></ion-icon>
              <span class="selected" data-value="auto">Détection automatique</span>
              <ion-icon name="chevron-down-outline"></ion-icon>
            </div>
            <ul class="dropdown-menu">
              <li class="option active">Français</li>
              <li class="option">Anglais (É.-U.)</li>
            </ul>
          </div>
        </div>
        <div class="text-area">
          <textarea
            id="input-text"
            cols="30"
            rows="10"
            placeholder="Saisissez votre texte"
          ></textarea>
          <button id="voice-input" class="voice-btn">
            <ion-icon name="mic-outline"></ion-icon>
          </button>
          <div class="chars"><span id="input-chars">0</span> / 5000</div>
        </div>
        <div class="card-bottom">
          <p>Ou choisissez un document !</p>
          <label for="upload-document">
            <span id="upload-title">Choisir un fichier</span>
            <ion-icon name="cloud-upload-outline"></ion-icon>
            <input type="file" id="upload-document" hidden />
          </label>
        </div>
      </div>

      <div class="center">
        <div class="swap-position">
          <ion-icon name="swap-horizontal-outline"></ion-icon>
        </div>
      </div>

      <div class="card output-wrapper">
        <div class="to">
          <span class="heading">À :</span>
          <div class="dropdown-container" id="output-language">
            <div class="dropdown-toggle">
              <ion-icon name="globe-outline"></ion-icon>
              <span class="selected" data-value="en">Anglais</span>
              <ion-icon name="chevron-down-outline"></ion-icon>
            </div>
            <ul class="dropdown-menu">
              <li class="option active">Anglais</li>
              <li class="option">Français</li>
            </ul>
          </div>
        </div>
        <textarea
          id="output-text"
          cols="30"
          rows="10"
          placeholder="Le texte traduit apparaîtra ici"
          disabled
        ></textarea>
        <div class="card-bottom">
          <p>Télécharger en document !</p>
          <button id="download-btn">
            <span>Télécharger</span>
            <ion-icon name="cloud-download-outline"></ion-icon>
          </button>
        </div>
      </div>
    </div>

    <script>
      // Script de reconnaissance vocale (Speech-to-Text)

      const voiceBtn = document.getElementById('voice-input');
      const inputText = document.getElementById('input-text');

      // Fonction pour démarrer la reconnaissance vocale
      if ('webkitSpeechRecognition' in window) {
        const recognition = new webkitSpeechRecognition();
        recognition.continuous = false;
        recognition.interimResults = false;
        recognition.lang = 'fr-FR'; // Langue française

        // Démarre la reconnaissance vocale lorsqu'on clique sur l'icône du micro
        voiceBtn.addEventListener('click', () => {
          recognition.start();
          voiceBtn.classList.add('recording'); // Optionnel : ajouter une classe pour signaler l'enregistrement
        });

        // Lorsque la reconnaissance est terminée, insérer le texte dans le champ
        recognition.onresult = (event) => {
          const result = event.results[0][0].transcript;
          inputText.value = result; // Insérer le texte dans le champ
        };

        // En cas d'erreur
        recognition.onerror = () => {
          voiceBtn.classList.remove('recording');
        };

        // Lorsque la reconnaissance se termine
        recognition.onend = () => {
          voiceBtn.classList.remove('recording');
        };
      } else {
        // Si la reconnaissance vocale n'est pas supportée
        voiceBtn.style.display = 'none';
      }
    </script>

    <script src="script/languages.js"></script>
    <script src="script/script.js"></script>
  </body>
</html>
